name: Mixed Messages CI

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run JavaScript checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show Node version
        run: node --version

      - name: Install project
        run: npm install

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run program
        run: npm test